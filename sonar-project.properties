# SonarCloud requires the organization. Travis used to supply this via its
# addons.sonarcloud.organization setting rather than this file, so it went
# missing when CI moved to GitHub Actions.
sonar.organization=openva

# must be unique in a given SonarQube instance
sonar.projectKey=openva_vabusinesses.org
# this is the name and version displayed in the SonarQube UI. Was mandatory prior to SonarQube 6.1.
sonar.projectName=vabusinesses
sonar.projectVersion=1.0
 
# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set. 
sonar.sources=.

# Third-party and generated files are not ours to fix, and scanning them dilutes
# the project's own metrics -- vendor/ alone is over a thousand PHP files.
sonar.exclusions=vendor/**,node_modules/**,data/**,templates_c/**,mini-default.min.css,municipalities.geojson,composer.lock,package-lock.json

# Tests are exercised, not measured for coverage.
sonar.test.exclusions=deploy/tests/**

#sonar.php.tests.reportPath=test-report.xml
sonar.php.coverage.reportPaths=coverage-report.clover
