version: 0.0
os: linux
files:
  - source: ./
    destination: /vol/vabusinesses.org/htdocs/
file_exists_behavior: OVERWRITE
permissions:
    - object: /vol/vabusinesses.org/htdocs/
      owner: ubuntu
      group: ubuntu
      mode: 775
      acls:
        - "d:u::rwx"
        - "d:g::rwx"
        - "d:o::rwx"
      type:
       - directory
AfterInstall:
  - location: /vol/vabusinesses.org/htdocs/deploy/postdeploy.sh
