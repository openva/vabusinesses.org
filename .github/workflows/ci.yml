name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allow a run to be kicked off by hand.
  workflow_dispatch:
    inputs:
      test_source_data:
        description: 'Also run the slow SCC download/rebuild tests'
        type: boolean
        default: false
  # Exercise the SCC download and database rebuild weekly, so a change on their
  # end surfaces here rather than in a silently stale database.
  schedule:
    - cron: '0 5 * * 1'

# Cancel an in-progress run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarCloud wants full history to attribute issues to commits.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      # Produces mini-default.min.css, which the site links to but does not
      # commit.
      - name: Build front-end assets
        run: npm install && npm run build

      # Smarty compiles templates into this directory. It is gitignored, so it
      # is absent from a fresh checkout and has to be created here.
      - name: Create the Smarty compile directory
        run: mkdir -p templates_c && chmod 777 templates_c

      # The API and front-end tests need a populated database. Building one means
      # downloading 169 MB from the SCC and loading two million rows, so cache it
      # rather than doing that on every push. The key carries the ISO week, so it
      # refreshes weekly -- roughly the cadence the SCC republishes on.
      - name: Work out the current week
        id: week
        run: echo "stamp=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached database
        id: cache-data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data
          key: scc-data-${{ steps.week.outputs.stamp }}
          # An older week's data is fine for testing; better than a 10-minute
          # rebuild on every run.
          restore-keys: scc-data-

      # Stands up the container, installs Composer dependencies inside it, and
      # verifies the site answers with a 200.
      - name: Stand up the site
        run: ./docker-run.sh

      # The source-data tests download the full SCC dataset and rebuild the
      # database, so they run only on the weekly schedule or when asked for.
      - name: Run tests
        env:
          TEST_SOURCE_DATA: ${{ (github.event_name == 'schedule' || inputs.test_source_data) && '1' || '0' }}
        run: ./run-tests.sh

      - name: Show container logs on failure
        if: failure()
        run: docker logs vabusinesses

      # coverage-report.clover is no longer consumed by a scan in this workflow
      # (see the note in sonar-project.properties), but is kept as an artifact so
      # the numbers are available per-run.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            test-report.xml
            coverage-report.clover
          if-no-files-found: ignore

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    # Only release from master, never from a pull request.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end assets
        run: npm install && npm run build

      - name: Install PHP dependencies
        uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6
        with:
          php_version: '8.2'
          dev: no
          args: --no-interaction --no-progress

      # This bundle carries no secrets: the Slack webhook lives in
      # /etc/vabusinesses.env on the server, outside the deployed code. (The
      # Mapbox token in includes/header.php is public by design -- the browser
      # sends it to fetch tiles -- and is restricted by URL at Mapbox.)
      - name: Build the deployment bundle
        run: |
          mkdir -p upload
          zip -qr upload/latest.zip . \
            -x '.git/*' '.github/*' 'upload/*' 'data/*' 'node_modules/*' \
               'templates_c/*' '*.sqlite' '*.csv'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload the bundle to S3
        id: upload
        run: |
          aws s3 cp upload/latest.zip s3://deploy.vabusinesses.org/latest.zip

          # Read back the ETag of the object we just wrote, so the deployment can
          # be pinned to it. Without this, create-deployment resolves whatever is
          # at that key when the deployment starts, and the agent re-checks the
          # ETag on the instance -- if the two disagree the deployment fails with
          # "Expected deployment artifact bundle etag ... but was actually ...".
          ETAG=$(aws s3api head-object \
            --bucket deploy.vabusinesses.org \
            --key latest.zip \
            --query 'ETag' --output text | tr -d '"')

          if [ -z "$ETAG" ]; then
            echo "ERROR: could not read back the uploaded bundle's ETag." >&2
            exit 1
          fi

          echo "Uploaded bundle has ETag $ETAG"
          echo "etag=$ETAG" >> "$GITHUB_OUTPUT"

      - name: Release with CodeDeploy
        run: |
          ID=$(aws deploy create-deployment \
            --application-name VA-Businesses \
            --deployment-group-name VA-Businesses \
            --file-exists-behavior OVERWRITE \
            --s3-location bucket=deploy.vabusinesses.org,key=latest.zip,bundleType=zip,eTag=${{ steps.upload.outputs.etag }} \
            --query 'deploymentId' --output text)
          echo "Deployment $ID created; waiting for it to finish."
          aws deploy wait deployment-successful --deployment-id "$ID"
